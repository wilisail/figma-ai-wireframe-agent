<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Wall-C</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="intro">
    <div id="brand-row">
      <h1 id="brand-title">WALL-C</h1>
      <svg id="brand-mark" viewBox="0 0 100 60" aria-hidden="true">
        <path d="M 40 8 A 18 18 0 0 0 40 44" fill="none" stroke="#f0ab00" stroke-width="17"/>
        <rect x="40" y="8" width="48" height="36" rx="3" fill="#3d63d8"/>
        <polygon points="50,16 59,16 54.5,25" fill="#7ac143"/>
        <polygon points="66,16 75,16 70.5,25" fill="#7ac143"/>
        <circle cx="62" cy="35" r="6" fill="#f0ab00"/>
      </svg>
    </div>
    <p id="brand-tagline">Dump items fast as you clear a shelf, then sweep through and sort each one into
      Utility, Memento or Rubbish — and decide whether it gets Displayed, Safekept, or Discarded.</p>
  </div>

  <header id="topbar">
    <div id="timer" class="timer">90:00</div>
    <div id="uncat-count" class="uncat-count">0 uncategorized</div>
  </header>

  <form id="quick-add" autocomplete="off">
    <input type="text" id="name-input" name="name" placeholder="Item name" required>
    <input type="number" id="qty-input" name="qty" min="1" value="1" inputmode="numeric">
    <button type="submit">Add</button>
  </form>

  <div id="toolbar">
    <button id="summary-toggle" type="button">Summary</button>
    <button id="reset-btn" type="button" class="danger">Reset</button>
  </div>

  <main id="list-view">
    <div id="groups"></div>
  </main>

  <main id="summary-view" hidden>
    <div id="summary-groups"></div>
    <button id="copy-btn" type="button">Copy to clipboard</button>
  </main>

  <div id="sheet-overlay" hidden></div>
  <div id="sheet" hidden>
    <div class="sheet-handle"></div>
    <h2 id="sheet-name"></h2>

    <div class="field-group">
      <label>Type</label>
      <div class="btn-row" id="type-buttons">
        <button type="button" class="opt-btn" data-type="utility">Utility</button>
        <button type="button" class="opt-btn" data-type="memento">Memento</button>
        <button type="button" class="opt-btn" data-type="rubbish">Rubbish</button>
      </div>
    </div>

    <div class="field-group">
      <label>Action</label>
      <div class="btn-row" id="action-buttons">
        <button type="button" class="opt-btn" data-action="display">Display</button>
        <button type="button" class="opt-btn" data-action="safekeep">Safekeep</button>
        <button type="button" class="opt-btn" data-action="discard">Discard</button>
      </div>
    </div>

    <div class="field-group">
      <label for="sheet-qty">Quantity</label>
      <input type="number" id="sheet-qty" min="1">
    </div>

    <div class="field-group" id="location-group" hidden>
      <label for="sheet-location">Location</label>
      <input type="text" id="sheet-location" placeholder="Where kept">
    </div>

    <button type="button" id="delete-btn" class="danger full-width">Delete</button>
    <button type="button" id="sheet-close" class="full-width">Close</button>
  </div>

<script src="app.js"></script>
</body>
</html>
